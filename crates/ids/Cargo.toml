[package]
name = "chatt-ids"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []
toml = ["dep:toml-spanner"]

[dependencies]
jsony = "0.1.10"
kvlog = { git = "https://github.com/exrok/kvlog", rev = "2182d43ba7a20d2aa16e37b8c3ba6d8502cf7787", default-features = false }
toml-spanner = { version = "1.0.3", features = ["to-toml", "from-toml", "derive"], optional = true }
uuid = { version = "1.7.0", default-features = false }
